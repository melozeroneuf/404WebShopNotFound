<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Warenkorb</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../res/css/style.css">
</head>
<body>
    <main class="cart-page">
        <section class="cart-card">
            <div class="cart-image">
                <div class="cart-image-inner">
                    <span class="cart-image-tag">Checkout</span>
                    <h1>Dein Warenkorb</h1>
                    <p>Prüfe deine Auswahl und passe die Mengen an.</p>
                </div>
            </div>

            <div class="cart-box">
                <div class="cart-header">
                    <div>
                        <h2>Warenkorb</h2>
                        <p class="cart-subtitle">Hier siehst du alle Artikel.</p>
                    </div>
                    <a class="cart-back" href="../index.html">Zurück zum Shop</a>
                </div>

                <div id="cart" class="cart-content">
                    <p class="cart-empty">Dein Warenkorb wird geladen.</p>
                </div>

                <div class="coupon-box">
                    <input type="text" id="couponCode" placeholder="Gutscheincode">
                    <button id="applyCouponBtn">Einlösen</button>
                    <p id="couponMessage"></p>
                </div>

                <div class="cart-footer">
                    <div class="cart-summary">
                        <span>Gesamt</span>
                        <strong>0,00 EUR</strong>
                    </div>
                    <button onclick="goCheckout()" class="checkout-btn"> Zur Kasse </button>
                </div>
            </div>
        </section>
    </main>

<script src="../js/cart.js"></script>
</body>
</html>
