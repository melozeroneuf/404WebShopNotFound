<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Mein Konto</title>
    <link rel="stylesheet" href="../res/css/style.css">
</head>

<body>

<main class="account-page">

    <section class="account-card">

        <div class="account-image">
            <img src="../img/account-chrome.png" alt="Konto Illustration">
        </div>

        <div class="account-content">

            <div class="page-header-row">
                <h2>Mein Konto</h2>
                <a class="cart-back" href="../index.html">Zurück zum Shop</a>
            </div>

            <p class="account-subtitle">Verwalte deine persönlichen Daten.</p>

            <form id="accountForm" class="account-form">

                <div class="form-group">
                    <label for="username">Benutzername</label>
                    <input type="text" id="username" name="username">
                </div>

                <div class="form-group">
                    <label for="email">E-Mail-Adresse</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstname">Vorname</label>
                        <input type="text" id="firstname" name="firstname">
                    </div>

                    <div class="form-group">
                        <label for="lastname">Nachname</label>
                        <input type="text" id="lastname" name="lastname">
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Straße</label>
                    <input type="text" id="address" name="address">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="zip">PLZ</label>
                        <input type="text" id="zip" name="zip">
                    </div>

                    <div class="form-group">
                        <label for="city">Ort</label>
                        <input type="text" id="city" name="city">
                    </div>
                </div>

                <div class="form-group">
                    <label for="paymentInfo">Zahlungsinformation</label>
                    <input type="text" id="paymentInfo" name="paymentInfo">
                </div>

                <div class="password-toggle-box">
                    <button type="button" id="togglePasswordChange" class="password-toggle-btn">
                        Passwort ändern
                    </button>

                    <div id="passwordChangeBox" class="password-change-box hidden">

                        <div class="form-row">

                            <div class="form-group">
                                <label for="newPassword">Neues Passwort</label>
                                <input type="password" id="newPassword" name="newPassword">
                            </div>

                            <div class="form-group">
                                <label for="newPasswordRepeat">
                                    Neues Passwort wiederholen
                                </label>
                                <input type="password"
                                       id="newPasswordRepeat"
                                       name="newPasswordRepeat">
                            </div>

                        </div>

                    </div>
                </div>

                <div class="form-group">
                    <label for="currentPassword">
                        Aktuelles Passwort (für Änderungen erforderlich)
                    </label>

                    <input type="password"
                           id="currentPassword"
                           name="currentPassword"
                           placeholder="Aktuelles Passwort eingeben">
                </div>

                <p id="accountMessage" class="account-message"></p>

                <div class="account-actions">
                    <button type="submit" class="save-btn">
                        Änderungen speichern
                    </button>
                </div>

            </form>

        </div>

    </section>

</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/account.js"></script>

</body>
</html>
