<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Mein Konto</title>
    <link rel="stylesheet" href="../res/css/style.css">
</head>

<body>

<main class="account-page">

    <section class="account-card">

        <div class="account-image">
            <img src="../img/account-chrome.png" alt="Konto Illustration">
        </div>

        <div class="account-content">

            <div class="page-header-row">
                <h2>Mein Konto</h2>
                <a class="cart-back" href="../index.html">Zurück zum Shop</a>
            </div>
            <p class="account-subtitle">Verwalte deine persönlichen Daten.</p>

            <div class="profile-section">

                <div class="profile-image-box">
                    <img src="../img/default-avatar.png" alt="Profilbild" class="profile-image">

                    <label for="profileUpload" class="profile-upload-btn">
                        Profilbild auswählen
                    </label>

                    <input type="file" id="profileUpload" name="profileUpload" accept="image/*">
                </div>

                <form id="accountForm" class="account-form">

                    <div class="form-group">
                        <label for="username">Benutzername</label>
                        <input type="text" id="username" name="username" value="MaxMuster">
                    </div>

                    <div class="form-group">
                        <label for="email">E-Mail-Adresse</label>
                        <input type="email" id="email" name="email" value="max@example.com">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstname">Vorname</label>
                            <input type="text" id="firstname" name="firstname" value="Max">
                        </div>

                        <div class="form-group">
                            <label for="lastname">Nachname</label>
                            <input type="text" id="lastname" name="lastname" value="Mustermann">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="birthdate">Geburtsdatum</label>
                        <input type="date" id="birthdate" name="birthdate">
                    </div>

                    <div class="form-group">
                        <label for="phone">Telefonnummer</label>
                        <input type="tel" id="phone" name="phone" value="+43 123 456789">
                    </div>

                    <div class="form-group">
                        <label for="address">Adresse</label>
                        <input type="text" id="address" name="address" value="Musterstraße 1, 1010 Wien">
                    </div>

                    <div class="account-actions">
                        <button type="button" class="cancel-btn">Abbrechen</button>
                        <button type="submit" class="save-btn">Änderungen speichern</button>
                    </div>

                </form>

            </div>

        </div>
    </section>

</main>

</body>
</html>
